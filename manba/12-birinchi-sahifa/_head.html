html,body{margin:0;background:#fff;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:Inter,"Liberation Sans",sans-serif;color:#0B1020;-webkit-font-smoothing:antialiased}

.chip.r{color:#F04438}.chip.r .n{background:#F04438}

#cap{position:absolute;left:0;width:1080px;top:1470px;display:flex;justify-content:center;z-index:60}
