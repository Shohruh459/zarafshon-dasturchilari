</div><script>
const CFG=__CFG__; const sc=CFG.sc;
const clamp=x=>Math.min(1,Math.max(0,x)), ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)}, eio=x=>{x=clamp(x);return x*x*(3-2*x)};

function sceneAt(tt){for(const k of order){if(tt<sc[k][0]+sc[k][1])return k}return 'cta'}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const NODES=[
 {id:'zal',y:450,em:'🍽️',h:'ZAL',role:'Frontend',rc:'#ffd166',s:'Siz ko‘radigan va bosadigan narsa',chips:['🔘 tugma','🖼️ rasm','📝 matn']},
 {id:'oshxona',y:790,em:'👨‍🍳',h:'OSHXONA',role:'Backend',rc:'#ff9f6b',s:'Buyurtmani qabul qilib, tayyorlaydi',chips:['📥 buyurtma','🍳 tayyorlash']},
 {id:'ombor',y:1130,em:'🗄️',h:'OMBOR',role:'Baza',rc:'#5ad9b4',s:'Hamma narsa saqlanadigan joy',chips:['📦 mahsulot','📋 ro‘yxat']}];
const nodeEls=NODES.map(n=>{const d=document.createElement('div');d.className='node';d.style.top=n.y+'px';
 d.innerHTML=`<div class="em">${n.em}</div><div class="col"><div class="h">${n.h}<span class="role" style="background:${n.rc}">${n.role}</span></div><div class="s">${n.s}</div><div class="chips">${n.chips.map(c=>`<div>${c}</div>`).join('')}</div></div><div class="ok">✓</div>`;
 $('nodes').appendChild(d);return d});
const HEAD={hook:'<div class="l1">SAYT QANDAY<br>ISHLAYDI?</div><div class="chip" style="margin-top:14px">🍽️ restoran misolida</div>',
 zal:'<div class="tag">1-QISM</div><div class="l3">Zal = Frontend</div>',
 oshxona:'<div class="tag">2-QISM</div><div class="l3">Oshxona = Backend</div>',
 ombor:'<div class="tag">3-QISM</div><div class="l3">Ombor = Ma‘lumotlar bazasi</div>',

let lastScene='';
const fxB=$('fxB').getContext('2d'),fxF=$('fxF').getContext('2d');
function ambient(tt){fxB.clearRect(0,0,1080,1920);fxB.globalCompositeOperation='lighter';
 for(let i=0;i<70;i++){const sp=30+rnd(i)*70,x=(rnd(i+1)*1080+Math.sin(tt*0.6+i)*30+1080)%1080,y=((rnd(i+2)*2200-tt*sp)%2200+2200)%2200-150;
  const a=0.25+0.25*Math.sin(tt*2+i),r=2+rnd(i+3)*4;fxB.fillStyle=`rgba(${i%2?'160,140,255':'255,190,120'},${a})`;fxB.beginPath();fxB.arc(x,y,r,0,7);fxB.fill()}}
const CONF=['#ffd166','#ff6b6b','#b388ff','#5ad9b4','#ffffff','#ff9f6b'];
const A=sc.api[0],C=sc.cta[0],H=sc.hook[0];
const T=CFG.trip; // waiter keyframes inside api scene
const BUR=[{t:H+2.3,x:540,y:1010,n:30,conf:false},{t:A+T.arr[1],x:600,y:925,n:18,conf:false},{t:A+T.arr[2],x:600,y:1265,n:18,conf:false},{t:A+T.arr[3],x:600,y:925,n:18,conf:false},{t:A+T.arr[4],x:600,y:585,n:26,conf:false},{t:C+0.25,x:540,y:820,n:40,conf:true}];
function bursts(tt){fxF.clearRect(0,0,1080,1920);fxF.globalCompositeOperation='lighter';
 BUR.forEach((b,bi)=>{const age=tt-b.t;if(age<0||age>3.2)return;
  if(!b.conf){if(age>1.0)return;for(let i=0;i<b.n;i++){const ang=rnd(bi*50+i)*6.283,sp=260+rnd(bi*50+i+7)*420,r=(1-age)*7+1;fxF.fillStyle=`rgba(255,${200+rnd(i)*55|0},${140+rnd(i+4)*80|0},${1-age})`;fxF.beginPath();fxF.arc(b.x+Math.cos(ang)*sp*age,b.y+Math.sin(ang)*sp*age+200*age*age,r,0,7);fxF.fill()}
   fxF.strokeStyle=`rgba(255,200,140,${1-age})`;fxF.lineWidth=6;fxF.beginPath();fxF.arc(b.x,b.y,30+age*300,0,7);fxF.stroke()}
  else{fxF.globalCompositeOperation='source-over';for(let i=0;i<b.n*3;i++){const ang=-Math.PI*(0.05+0.9*rnd(bi*90+i)),sp=600+rnd(bi*90+i+5)*900,x=b.x+Math.cos(ang)*sp*age,y=b.y+Math.sin(ang)*sp*age+1500*age*age*0.5,w=14+rnd(i+1)*14,h=8+rnd(i+2)*8,rot=rnd(i+3)*6.28+age*(rnd(i+4)*18-9);
   if(y>1980)continue;fxF.save();fxF.translate(x,y);fxF.rotate(rot);fxF.fillStyle=CONF[i%CONF.length];fxF.globalAlpha=Math.min(1,(3.2-age)/0.6);fxF.fillRect(-w/2,-h/2,w,h);fxF.restore()}fxF.globalAlpha=1;fxF.globalCompositeOperation='lighter'}})}
function capAt(tt){for(const c of CFG.caps){if(tt>=c.s&&tt<c.e)return c}return CFG.caps[CFG.caps.length-1]}
const LANE_Y=[585,925,1265];
function setNode(i,op,sc_,glow,showChips,chipT,lt,ok){const d=nodeEls[i];d.style.opacity=op;d.style.transform=`scale(${sc_})`;
 d.style.boxShadow=glow?`0 0 70px rgba(255,200,120,${glow}),0 26px 70px rgba(0,0,0,.5)`:'0 26px 70px rgba(0,0,0,.5)';
 d.style.borderColor=glow?`rgba(255,220,150,${0.4+glow*0.6})`:'rgba(255,255,255,.2)';
 [...d.querySelectorAll('.chips div')].forEach((c,j)=>{const p=showChips?back((lt-(chipT+j*0.55))/0.35):0;c.style.opacity=clamp(p*2);c.style.transform=`scale(${Math.max(0.01,p)})`});
 d.querySelector('.ok').style.transform=`scale(${ok?back((lt-ok)/0.35):0})`}
window.setT=function(tt){
 const k=sceneAt(tt),t0=sc[k][0],D=sc[k][1],lt=tt-t0;
 $('b1').style.transform=`translate(${Math.sin(tt*.5)*120}px,${Math.cos(tt*.4)*90}px)`;
 $('b2').style.transform=`translate(${Math.cos(tt*.45)*110}px,${Math.sin(tt*.6)*100}px)`;
 $('b3').style.transform=`translate(${Math.sin(tt*.35+2)*140}px,${Math.cos(tt*.5)*80}px)`;
 $('floor').style.backgroundPosition=`0px ${tt*150}px`;
 if(k!==lastScene){$('head').innerHTML=HEAD[k];lastScene=k}
 const hp=ease(lt/0.28);$('head').style.transform=`scale(${1+0.14*(1-hp)})`;
 // defaults
 let nodeOp=[.2,.2,.2],glow=[0,0,0],showChips=false,okT=[0,0,0],nsc=[1,1,1];
 const act=k==='zal'?0:k==='oshxona'?1:k==='ombor'?2:-1;
 const entry=ease(lt/0.4);
 if(k==='hook'){nodeOp=[.22,.22,.22]}
 else if(act>=0){nodeOp=[.3,.3,.3];nodeOp[act]=1;glow[act]=0.5+0.3*Math.sin(lt*4);nsc[act]=1+0.03*entry;showChips=true}
 else if(k==='api'||k==='cta'){nodeOp=[1,1,1];showChips=true}
 // for finished concepts keep earlier nodes bright
 if(k==='oshxona')nodeOp[0]=.5;if(k==='ombor'){nodeOp[0]=.5;nodeOp[1]=.5}
 // api: flashes on arrival
 let wy=LANE_Y[0],bub='',bubY=0,bubOn=0;
 if(k==='api'){const K=T.t,Y=T.y;let seg=0;for(let i=0;i<K.length-1;i++){if(lt>=K[i])seg=i}
  const a=eio((lt-K[seg])/(K[seg+1]-K[seg]||1));wy=lt>=K[K.length-1]?Y[Y.length-1]:Y[seg]+(Y[seg+1]-Y[seg])*a;
  // bubbles
  T.b.forEach(b=>{if(lt>=b[0]&&lt<b[1]){bub=b[2];bubOn=1}});
  // node flash on arrival
  T.arr.forEach((ta,i)=>{if(i>0){const ni=i===1?1:i===2?2:i===3?1:0;const f=Math.max(0,1-(lt-ta)/0.8);if(lt>=ta&&f>0){glow[ni]=Math.max(glow[ni],f*0.9);nsc[ni]=1+0.04*f}}});
  if(lt>=T.arr[4])okT=[T.arr[4]+0.2,0,0]}
 if(k==='cta')okT=[0.3,0.6,0.9];
 for(let i=0;i<3;i++){const ap=back((lt-i*0.12)/0.4);const op=k==='hook'?nodeOp[i]*clamp(ap):nodeOp[i];setNode(i,op,nsc[i]*(k==='hook'?0.95+0.05*clamp(ap):1),glow[i],showChips,k==='api'||k==='cta'?-5:(act>=0?0.9:0),lt,okT[i])}
 // lane + waiter
 const laneOn=(k==='api'||k==='cta'||k==='hook')?1:0.0;
 $('lane').style.opacity=k==='hook'?0.25:(k==='api'||k==='cta')?1:0.2;$('lanelit').style.opacity=k==='api'?1:0;
 if(k==='api'){$('lanelit').style.top=Math.min(wy,LANE_Y[0])+'px';$('lanelit').style.height=(Math.abs(wy-LANE_Y[0]))+'px';$('lanelit').style.top=LANE_Y[0]+'px'}
 const wOn=(k==='api'||k==='cta');$('waiter').style.display=wOn?'block':'none';
 $('waiter').style.top=(wy-48+Math.sin(tt*9)*(k==='api'&&bubOn?4:0))+'px';
 $('bubble').style.display=(k==='api'&&bubOn)?'block':'none';if(k==='api'&&bubOn){$('bubble').textContent=bub;$('bubble').style.top=(wy-34)+'px'}
 if(k==='cta'){$('waiter').style.top=(LANE_Y[0]-48+Math.sin(tt*5)*6)+'px'}
 // big button (hook)
