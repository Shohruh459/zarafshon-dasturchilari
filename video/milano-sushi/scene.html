<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Milano sushi</title>
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 500; src: url(../registon/fonts/montserrat-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 600; src: url(../registon/fonts/montserrat-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url(../promo/fonts/montserrat-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 500; src: url(../milano/fonts/montserrat-cyrillic-500-normal.woff2) format('woff2'); unicode-range: U+0400-045F; }
  @font-face { font-family: 'Montserrat'; font-weight: 600; src: url(../milano/fonts/montserrat-cyrillic-600-normal.woff2) format('woff2'); unicode-range: U+0400-045F; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0605; }
  body { font-family: 'Montserrat', sans-serif; color: #fff; --red: #e2231a; --green: #1f8a3b; --gold: #ffc247; --cream: #fff4e3; }
  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .dark { background: radial-gradient(ellipse 80% 55% at 50% 48%, #3a1510 0%, #160908 60%, #080404 100%); }
  .abs { position: absolute; left: 0; top: 0; will-change: transform; }
  .piece { filter: drop-shadow(0 22px 26px rgba(0,0,0,.6)); }
  /* Reels safe area: x 120-960, y 220-1500 */
  .big { position: absolute; left: 60px; right: 60px; text-align: center; font-weight: 800; line-height: 1; text-shadow: 0 8px 30px rgba(0,0,0,.6); }

  /* 1: flying over Zarafshon */
  #s1 { background: #efe8dc; perspective: 1400px; }
  #mapWrap { position: absolute; left: 50%; top: 52%; width: 1720px; height: 1120px; margin: -560px 0 0 -860px; transform-origin: 50% 50%; }
  #mapWrap > svg:first-child { width: 100%; height: 100%; overflow: visible; }
  #pin { position: absolute; width: 150px; left: 0; top: 0; transform-origin: 50% 100%; }
  .ring { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 6px solid var(--red); }
  #zar { top: 250px; font-size: 138px; letter-spacing: .02em; color: #1c0f09; text-shadow: 0 6px 0 rgba(255,255,255,.6); }
  #zar span { display: inline-block; }
  #zarSub { position: absolute; left: 0; right: 0; top: 410px; text-align: center; }
  #zarSub b { display: inline-block; background: var(--red); color: #fff; font-weight: 800; font-size: 46px; padding: 8px 26px 12px; border-radius: 14px; transform: rotate(-2deg); }
  #speed { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.0) 0deg 4deg, rgba(255,255,255,.55) 4.5deg 5deg); opacity: 0;
           -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 25%, #000 60%); }

  /* 2: coins */
  #q2 { top: 300px; font-size: 104px; }
  #q2 span { color: var(--gold); }
  /* 3: the cut */
  #slash { position: absolute; left: -200px; top: 940px; width: 1480px; height: 16px; background: #fff; border-radius: 8px; transform-origin: 0 50%;
           box-shadow: 0 0 30px #fff, 0 0 80px rgba(255,90,60,.9); opacity: 0; }
  /* 4: set */
  #setTitle { top: 250px; font-size: 110px; }
  #setTitle small { display: block; font-size: 46px; font-weight: 600; color: var(--cream); margin-top: 14px; }
  /* 5: review */
  #stars { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-size: 110px; color: var(--gold); letter-spacing: 10px; text-shadow: 0 0 30px rgba(255,194,71,.6); }
  #stars span { display: inline-block; }
  #quote { position: absolute; left: 110px; right: 110px; top: 680px; background: #fff; color: #24140d; border-radius: 44px 44px 44px 10px; padding: 50px 54px 44px; box-shadow: 0 30px 70px rgba(0,0,0,.5); }
  #quote p { font-weight: 600; font-size: 54px; line-height: 1.25; }
  #quote .who { margin-top: 22px; font-weight: 500; font-size: 32px; color: #7a5a48; }
  #revTop { top: 300px; font-size: 62px; }
  /* 6: call */
  #logo { position: absolute; left: 190px; top: 300px; width: 700px; background: #fff; border-radius: 40px; padding: 34px 50px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  #logo img { width: 100%; display: block; }
  #call { position: absolute; left: 110px; right: 110px; top: 720px; background: var(--red); border-radius: 40px; text-align: center; padding: 30px 20px 36px; box-shadow: 0 20px 70px rgba(226,35,26,.55); }
  #call .t { font-weight: 600; font-size: 40px; }
  #call .num { font-weight: 800; font-size: 80px; white-space: nowrap; margin-top: 6px; }
  #info { position: absolute; left: 90px; right: 90px; top: 1020px; text-align: center; font-weight: 600; font-size: 42px; line-height: 1.55; color: var(--cream); }
  #info b { color: var(--gold); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<section class="scene" id="s1">
  <div id="mapWrap">
    <svg viewBox="0 0 860 560">
      <!-- schematic after the Google Maps view (as in ../milano): Amir Temur street, Yoshlik street, the 6th microdistrict park -->
      <defs><pattern id="blocks" width="70" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
        <rect x="6" y="6" width="38" height="26" rx="3" fill="#e2d8c8"/><rect x="48" y="10" width="16" height="36" rx="3" fill="#e6ddcf"/><rect x="8" y="36" width="34" height="14" rx="3" fill="#e6ddcf"/>
      </pattern></defs>
      <rect x="-1400" y="-1400" width="3660" height="3360" fill="#efe8dc"/>
      <rect x="-1400" y="-1400" width="3660" height="3360" fill="url(#blocks)"/>
      <polygon points="352,318 770,-130 909,-1 487,447" fill="#bfe6c4"/>
      <line x1="-470" y1="1186" x2="1130" y2="-526" stroke="#fff" stroke-width="46"/>
      <line x1="-470" y1="-326" x2="1330" y2="1150" stroke="#fff" stroke-width="40"/>
      <line x1="120" y1="0" x2="-200" y2="320" stroke="#fff" stroke-width="16"/>
      <line x1="640" y1="560" x2="1060" y2="255" stroke="#fff" stroke-width="16"/>
      <line x1="-100" y1="420" x2="200" y2="700" stroke="#fff" stroke-width="16"/>
      <line x1="700" y1="-100" x2="980" y2="160" stroke="#fff" stroke-width="16"/>
      <text x="128" y="566" font-family="Montserrat" font-weight="600" font-size="24" fill="#8a7f72" transform="rotate(-47 128 566)">Amir Temur ko‘chasi</text>
      <text x="34" y="112" font-family="Montserrat" font-weight="600" font-size="24" fill="#8a7f72" transform="rotate(39.4 34 112)">Yoshlik ko‘chasi</text>
      <text x="560" y="200" font-family="Montserrat" font-weight="600" font-size="24" fill="#3f8a4d">6-mkr bog‘i</text>
    </svg>
    <div class="ring" id="ring1"></div><div class="ring" id="ring2"></div>
    <svg id="pin" viewBox="0 0 60 80"><path d="M30 78 C30 78 4 46 4 28 A26 26 0 0 1 56 28 C56 46 30 78 30 78Z" fill="#e2231a"/><circle cx="30" cy="28" r="10" fill="#fff"/></svg>
  </div>
  <div class="big" id="zar"></div>
  <div id="zarSub"><b>6-mikrorayon bog‘i yonida</b></div>
  <div id="speed"></div>
</section>

<section class="scene dark" id="s2">
  <div class="big" id="q2">Sushi<br><span>yoqadimi?</span></div>
</section>

<section class="scene dark" id="s3">
  <div id="slash"></div>
</section>

<section class="scene dark" id="s4">
  <img class="abs piece" id="set" src="../milano/assets/sushi-set.png" alt="">
  <div class="big" id="setTitle">MILANO FOODS<small>sushi va rollar</small></div>
</section>

<section class="scene dark" id="s5">
  <div class="big" id="revTop">Mijozlarimiz aytadi:</div>
  <div id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
  <div id="quote"><p>Самые лучшие суши в Зарафшане только в Милано Фудс</p><div class="who">— Muzaffarova, Telegram guruhidan</div></div>
</section>

<section class="scene dark" id="s6">
  <div id="logo"><img src="../milano/assets/logo.png" alt=""></div>
  <div id="call"><div class="t">Buyurtma uchun</div><div class="num">+998 93 873 40 00</div></div>
  <div id="info">Zarafshon bo‘ylab <b>yetkazib berish</b><br>Ish vaqti: <b>10:00 – 23:00</b></div>
</section>
<div id="flash"></div>

<script type="module">
  import { clamp, prog, lerp, eOut, eInOut } from '../quran/common/anim.js';
  const $ = (id) => document.getElementById(id);
  const eIn = (x) => x * x * x;
  const eBack = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

  // Timeline (seconds), on the 120 BPM grid of audio.js. Keep in sync with audio.js.
  const T = { rolls: 2.0, cut: 4.0, set: 6.5, review: 9.0, cta: 11.5, end: 15 };
  const SCENES = [['s1', 0, T.rolls], ['s2', T.rolls, T.cut], ['s3', T.cut, T.set], ['s4', T.set, T.review], ['s5', T.review, T.cta], ['s6', T.cta, T.end + 1]];
  const CUTS = [T.rolls, T.cut, T.set, T.review, T.cta];

  // "ZARAFSHON", letter by letter
  $('zar').innerHTML = [...'ZARAFSHON'].map((c) => `<span>${c}</span>`).join('');
  const letters = [...$('zar').children];

  // six roll pieces (face = cut face, side = the roll from the side), used by several scenes
  const PIECES = [1, 2, 3].flatMap((n) => ['face', 'side'].map((k) => `assets/roll-${n}-${k}.png`));
  function makePieces(scene, width) {
    return PIECES.map((src, i) => {
      const im = document.createElement('img'); im.className = 'abs piece'; im.src = src; im.style.width = `${width[i % 2]}px`;
      $(scene).insertBefore(im, $(scene).firstChild); return im;
    });
  }
  const all2 = makePieces('s2', [300, 300]);
  const coins = [0, 2, 4].map((i) => all2[i]);   // the three cut faces
  all2.forEach((im) => { if (!coins.includes(im)) im.remove(); });
  // the cut: one big face in two halves, then the other pieces rain down
  const half = [0, 1].map(() => { const im = document.createElement('img'); im.className = 'abs piece'; im.src = 'assets/roll-3-face.png'; im.style.width = '640px'; $('s3').insertBefore(im, $('slash')); return im; });
  half[0].style.clipPath = 'polygon(0 0, 100% 0, 100% 38%, 0 62%)';
  half[1].style.clipPath = 'polygon(0 62%, 100% 38%, 100% 100%, 0 100%)';
  const rain = makePieces('s3', [260, 240]);
  const orbit = makePieces('s4', [230, 210]);
  const floaters = makePieces('s5', [200, 180]);
  floaters.forEach((f) => { f.style.filter = 'blur(6px) brightness(.55)'; });

  let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const RAIN = rain.map((_, i) => ({ x: 120 + (i % 3) * 300 + rnd() * 60, y: 1180 + Math.floor(i / 3) * 190 + rnd() * 40, r: rnd() * 60 - 30, d: i * 0.1 }));
  const FLOAT = floaters.map((_, i) => ({ x: rnd() * 900, y: 150 + rnd() * 1500, s: 0.3 + rnd() * 0.5 }));

  const place = (el, x, y, rot = 0, sc = 1, extra = '') => { el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sc}) ${extra}`; };

  window.renderFrame = function (t) {
    for (const [id, a, b] of SCENES) $(id).style.opacity = t >= a && t < b ? 1 : 0;
    const dc = Math.min(...CUTS.map((c) => Math.abs(t - c)));
    $('flash').style.opacity = clamp(1 - dc / 0.12) * 0.7;

    // ---------- 1: fly over the map, drop the pin, whip-zoom into it ----------
    {
      const k = eOut(prog(t, 0, 1.3)), z = eIn(prog(t, 1.55, T.rolls));
      const tilt = lerp(58, 0, k), sc = lerp(0.55, 1.15, k) * lerp(1, 7, z);
      // pin tip in map coords (450, 250) of 860x560 -> px in the 1720x1120 wrap
      const px = 450 * 2, py = 250 * 2;
      $('mapWrap').style.transformOrigin = `${px}px ${py}px`;
      $('mapWrap').style.transform = `translateY(${lerp(250, 0, k)}px) rotateX(${tilt}deg) rotateZ(${lerp(-25, 0, k)}deg) scale(${sc})`;
      const pp = prog(t, 0.85, 1.2);
      $('pin').style.transform = `translate(${px - 75}px, ${py - 200 + (1 - eOut(pp)) * -400}px) scale(${pp >= 1 ? 1 + 0.2 * Math.exp(-(t - 1.2) * 10) : 1}, ${pp >= 1 ? 1 - 0.2 * Math.exp(-(t - 1.2) * 10) : 1})`;
      $('pin').style.opacity = clamp(pp * 5);
      [['ring1', 1.2], ['ring2', 1.4]].forEach(([id, t0]) => {
        const r = prog(t, t0, t0 + 0.6);
        $(id).style.left = `${px}px`; $(id).style.top = `${py}px`;
        $(id).style.opacity = r > 0 ? 1 - r : 0; $(id).style.transform = `scale(${1 + r * 5})`;
      });
      letters.forEach((el, i) => {
        const p = prog(t, 0.1 + i * 0.05, 0.4 + i * 0.05);
        el.style.transform = `translateY(${(1 - eOut(p)) * -300}px) scale(${p > 0 ? eBack(p) : 0})`;
        el.style.opacity = clamp(p * 4) * (1 - z);
      });
      const sp = prog(t, 0.7, 1.0);
      $('zarSub').style.opacity = clamp(sp * 3) * (1 - z);
      $('zarSub').style.transform = `scale(${sp > 0 ? eBack(sp) : 0})`;
      $('speed').style.opacity = z * 0.9;
    }

    // ---------- 2: three cut faces flip in like coins ----------
    coins.forEach((el, i) => {
      const t0 = T.rolls + 0.1 + i * 0.25, p = prog(t, t0, t0 + 0.45);
      const out = eIn(prog(t, T.cut - 0.45, T.cut));
      const x = 90 + i * 310, y = 880 + (i === 1 ? -60 : 0);
      place(el, x, y + (1 - eOut(p)) * 900 + Math.sin((t - t0) * 3 + i) * 12, (1 - eOut(p)) * 200 * (i % 2 ? -1 : 1), p > 0 ? eBack(p) * (1 + out * 2.5) : 0,
            `rotateY(${(1 - eOut(p)) * 720}deg)`);
      el.style.opacity = clamp(p * 4) * (1 - out);
    });
    {
      const p = prog(t, T.rolls + 0.15, T.rolls + 0.55);
      $('q2').style.opacity = clamp(p * 3) * (1 - prog(t, T.cut - 0.3, T.cut));
      $('q2').style.transform = `scale(${p > 0 ? eBack(p) : 0})`;
    }

    // ---------- 3: one big piece, a slash, it splits; the rest rain down ----------
    {
      const p = prog(t, T.cut, T.cut + 0.35), cut = eOut(prog(t, T.cut + 0.62, T.cut + 1.0));
      half.forEach((el, i) => {
        const s = i ? 1 : -1;
        place(el, 220 + s * cut * 40, 640 + s * cut * 70, s * cut * 8 + Math.sin(t * 2) * 2, p > 0 ? eBack(p) : 0);
      });
      const sl = prog(t, T.cut + 0.5, T.cut + 0.66);
      $('slash').style.opacity = sl > 0 ? 1 - prog(t, T.cut + 0.7, T.cut + 0.95) : 0;
      $('slash').style.transform = `rotate(-14deg) scaleX(${eOut(sl)})`;
      RAIN.forEach((r, i) => {
        const t0 = T.cut + 1.1 + r.d, q = prog(t, t0, t0 + 0.5);
        const bounce = q >= 1 ? Math.abs(Math.sin((t - t0 - 0.5) * 9)) * 40 * Math.exp(-(t - t0 - 0.5) * 5) : 0;
        place(rain[i], r.x, lerp(-500, r.y, eIn(q)) - bounce, r.r * (1 - q) * 4 + r.r);
        rain[i].style.opacity = q > 0 ? 1 : 0;
      });
    }

    // ---------- 4: the set rises, the pieces orbit it ----------
    {
      const p = eOut(prog(t, T.set, T.set + 0.6));
      place($('set'), 60, 760 + (1 - p) * 900, (1 - p) * 10);
      $('set').style.width = '960px';
      orbit.forEach((el, i) => {
        const a = (t - T.set) * 1.6 + i * (Math.PI * 2 / 6), q = eOut(prog(t, T.set + 0.2 + i * 0.06, T.set + 0.7 + i * 0.06));
        const x = 540 + Math.cos(a) * 430 * q - 115, y = 1060 + Math.sin(a) * 330 * q - 110;
        place(el, x, y, Math.sin(a) * 15, (0.8 + 0.25 * Math.sin(a)) * q);
        el.style.zIndex = Math.sin(a) > 0 ? 5 : 1; $('set').style.zIndex = 3;
      });
      const tp = prog(t, T.set + 0.3, T.set + 0.7);
      $('setTitle').style.opacity = clamp(tp * 3); $('setTitle').style.transform = `scale(${tp > 0 ? eBack(tp) : 0})`;
    }

    // ---------- 5: five stars, then the review ----------
    {
      [...$('stars').children].forEach((el, i) => {
        const p = prog(t, T.review + 0.2 + i * 0.1, T.review + 0.5 + i * 0.1);
        el.style.transform = `scale(${p > 0 ? eBack(p) : 0}) rotate(${(1 - p) * 90}deg)`;
      });
      const hp = eOut(prog(t, T.review, T.review + 0.4));
      $('revTop').style.opacity = hp; $('revTop').style.transform = `translateY(${(1 - hp) * 40}px)`;
      const qp = prog(t, T.review + 0.8, T.review + 1.25);
      $('quote').style.opacity = clamp(qp * 3); $('quote').style.transform = `translateY(${(1 - eOut(qp)) * 200}px) scale(${qp > 0 ? eBack(qp) : 0.5})`;
      floaters.forEach((el, i) => { const f = FLOAT[i]; place(el, f.x, f.y - (t - T.review) * 60 * (1 + i % 3), (t - T.review) * 20 * (i % 2 ? 1 : -1), f.s); });
    }

    // ---------- 6: logo, phone, delivery ----------
    {
      const lp = prog(t, T.cta, T.cta + 0.45);
      $('logo').style.transform = `scale(${lp > 0 ? eBack(lp) : 0})`;
      const cp = prog(t, T.cta + 0.4, T.cta + 0.85);
      const pulse = t > T.cta + 1.2 ? 1 + 0.04 * Math.max(0, Math.sin((t - T.cta) * Math.PI * 2)) : 1;
      $('call').style.transform = `scale(${cp > 0 ? eBack(cp) * pulse : 0})`;
      const ip = eOut(prog(t, T.cta + 0.9, T.cta + 1.3));
      $('info').style.opacity = ip; $('info').style.transform = `translateY(${(1 - ip) * 50}px)`;
    }
  };
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  window.sceneReady = true;
  window.renderFrame(0);
</script>
</body>
</html>
