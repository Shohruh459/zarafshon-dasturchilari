function rrGeo(w,h,r){const g=new THREE.ShapeGeometry(rrShape(w,h,r),12);const p=g.attributes.position,uv=g.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,(p.getX(i)+w/2)/w,(p.getY(i)+h/2)/h);return g}
const screenMat=new THREE.ShaderMaterial({uniforms:{t0:{value:T[0]},t1:{value:T[1]},t2:{value:T[2]},t3:{value:T[3]},wave:{value:0},u2:{value:0},u3:{value:0},bright:{value:1}},

 fragmentShader:`varying vec2 vUv;uniform sampler2D t0,t1,t2,t3;uniform float wave,u2,u3,bright;
 void main(){vec4 a=texture2D(t0,vUv),b=texture2D(t1,vUv),c2=texture2D(t2,vUv),c3=texture2D(t3,vUv);
  vec2 p=(vUv-vec2(0.5,0.72))*vec2(1.0,2.0);float d=length(p);
  float m=1.0-smoothstep(wave-0.015,wave+0.015,d);
  vec4 blue=mix(mix(b,c2,u2),c3,u3);vec4 c=mix(a,blue,m);
  float ring=smoothstep(0.07,0.0,abs(d-wave))*step(0.001,wave)*(1.0-smoothstep(1.55,1.75,wave));
  c.rgb+=vec3(ring)*1.4;c.rgb*=bright;gl_FragColor=vec4(c.rgb,1.0);}`});
const screen=new THREE.Mesh(rrGeo(1.22,2.44,0.12),screenMat);screen.position.z=0.082;phone.add(screen);
const notch=new THREE.Mesh(rrGeo(0.36,0.09,0.045),new THREE.MeshBasicMaterial({color:0x000000}));notch.position.set(0,1.16,0.085);phone.add(notch);
// ---------- exploded blocks (for the "open in browser" assembly)
const rects=[[0,.033,1,.072],[0,.105,1,.287],[.036,.449,.928,.123],[.036,.585,.928,.123],[.036,.721,.928,.123]];
const blocks=rects.map((r,i)=>{const sx=r[0]*IW,sy=r[1]*IH,sw=r[2]*IW,sh=r[3]*IH;const w=1.22*r[2],h=2.44*r[3];
 const mat=new THREE.MeshBasicMaterial({map:crop(sx,sy,sw,sh)});const side=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4});
 const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,0.03,4,0.015),[side,side,side,side,mat,side]);scene.add(m);
 m.userData={home:new THREE.Vector3((r[0]+r[2]/2-0.5)*1.22,1.22-(r[1]+r[3]/2)*2.44,0.1)};return m});
// ---------- 3D chips (Kontekst / Bo'limlar / Uslub)
function labelTex(txt,col){const c=document.createElement('canvas');c.width=512;c.height=160;const x=c.getContext('2d');x.fillStyle=col;x.beginPath();x.roundRect(0,0,512,160,80);x.fill();x.fillStyle='#15122a';x.font='800 78px Liberation Sans, Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,256,86);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const chipDefs=[['Kontekst','#ff9f6b'],['Bo‘limlar','#5ad9b4'],['Uslub','#b388ff']];
const chips=chipDefs.map((d,i)=>{const m=new THREE.Mesh(new RoundedBoxGeometry(0.62,0.2,0.06,4,0.03),[0,1,2,3,4,5].map(j=>j===4?new THREE.MeshStandardMaterial({map:labelTex(d[0],d[1]),emissive:0xffffff,emissiveMap:labelTex(d[0],d[1]),emissiveIntensity:.55,roughness:.35}):new THREE.MeshStandardMaterial({color:new THREE.Color(d[1]),roughness:.4,emissive:new THREE.Color(d[1]),emissiveIntensity:.4})));scene.add(m);return m});
// ---------- particles, floor, lights
const N=1600,pos=new Float32Array(N*3),sd=new Float32Array(N);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*14;pos[i*3+1]=(Math.random()-.5)*14;pos[i*3+2]=(Math.random()-.5)*10-2;sd[i]=Math.random()}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:0.035,color:0xb9a6ff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(pts);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x060518,metalness:.3,roughness:.6,envMapIntensity:.12}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.85;scene.add(floor);
const grid=new THREE.GridHelper(40,60,0x6a55ff,0x3a2f99);grid.position.y=-1.845;grid.material.transparent=true;grid.material.opacity=.4;scene.add(grid);
const l1=new THREE.PointLight(0xff6a4a,32,12),l2=new THREE.PointLight(0x7c5cff,32,12);scene.add(l1,l2);scene.add(new THREE.AmbientLight(0x6060a0,.45));
// ---------- 3D confetti
const NC=170,conf=new THREE.InstancedMesh(new THREE.BoxGeometry(0.13,0.075,0.012),new THREE.MeshStandardMaterial({roughness:.4,metalness:.1,emissive:0x222222}),NC);scene.add(conf);conf.frustumCulled=false;
const CC=['#ffd166','#ff6b6b','#b388ff','#5ad9b4','#ffffff','#ff9f6b'].map(c=>new THREE.Color(c));
for(let i=0;i<NC;i++)conf.setColorAt(i,CC[i%CC.length]);conf.instanceColor.needsUpdate=true;
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const dummy=new THREE.Object3D();
const CONF_T=[W_()+3.8,C_()+0.25];function W_(){return CFG.sc.how[0]}function C_(){return CFG.sc.cta[0]}
function updateConf(t){let active=-1,age=0;CONF_T.forEach((t0,i)=>{const a=t-t0;if(a>=0&&a<=3.4){active=i;age=a}});
 for(let i=0;i<NC;i++){
  if(active<0){dummy.position.set(0,-50,0);dummy.rotation.set(0,0,0);dummy.scale.setScalar(0.0001)}
  else{const a=-Math.PI*(0.08+0.84*R(i+active*100)),sp=2.4+R(i+7+active*100)*3.4;const vx=Math.cos(a)*sp*1.3,vy=-Math.sin(a)*sp,vz=(R(i+3)-.3)*3;
   dummy.position.set(vx*age*0.62,0.2+vy*age*0.62-0.5*4.2*age*age,1.2+vz*age*0.4);dummy.rotation.set(R(i+11)*6+age*(R(i+13)*16-8),R(i+17)*6+age*(R(i+19)*16-8),0);dummy.scale.setScalar(Math.max(0.0001,clamp(1-(age-2.6)/0.8)))}
  dummy.updateMatrix();conf.setMatrixAt(i,dummy.matrix)}
 conf.instanceMatrix.needsUpdate=true}
const comp=new EffectComposer(renderer);comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),0.55,0.55,1.0));comp.addPass(new OutputPass());
function clamp(x){return Math.min(1,Math.max(0,x))}
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)},eio=x=>{x=clamp(x);return x*x*(3-2*x)},back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const sc=CFG.sc,order=['hook','up','edit','how','cta'];
function sceneAt(tt){for(const k of order){if(tt<sc[k][0]+sc[k][1])return k}return 'cta'}
const OFFS={ctx:0,sec:SEG.slice(0,5).map(s=>s.t).join('').length,sty:SEG.slice(0,6).map(s=>s.t).join('').length};
function worldPxY(px){return (960-px)/398}
window.setGL=function(t){
 const k=sceneAt(t),t0=sc[k][0],D=sc[k][1],lt=t-t0;
 // phone pose
 let px=0,py=-0.1,pz=-0.5,ry=0,rx=0.05,s=1.15,bright=0.62,vis=1;
 if(k==='hook'){ry=-0.45+0.9*eio(lt/D);bright=0.62}
 else if(k==='up'){ry=0.45-0.9*eio(lt/D);bright=0.55}
 else if(k==='edit'){const e=ease(lt/0.5);pz=-0.5+0.5*e;py=-0.1-0.05*e;s=1.15-0.25*e;ry=0.18*Math.sin(lt*1.1);bright=0.55+0.45*e;rx=0.04}
 else if(k==='how'){pz=0;px=0;py=worldPxY(1290);s=0.42*back((lt-3.1)/0.45);ry=0.4*Math.sin(lt*2);bright=1;vis=lt>3.05?1:0;rx=0.04}
 else{const e=eio(lt/2.4);pz=0;py=-0.22;s=0.9-0.04*e;ry=Math.PI*2*e;rx=0.05*(1-e);bright=1}
 phone.visible=vis>0&&s>0.02;phone.position.set(px,py+Math.sin(t*1.3)*0.035,pz);phone.rotation.set(rx,ry,0);phone.scale.setScalar(Math.max(0.001,s));
 screenMat.uniforms.bright.value=bright;
 // state uniforms
 let wave=0,u2=0,u3=0;
 if(k==='edit'){wave=eio((lt-CFG.e[0].apply)/0.8)*1.8;u2=ease((lt-CFG.e[1].apply)/0.35);u3=ease((lt-CFG.e[2].apply)/0.2)}
 else if(k==='how'||k==='cta'){wave=3;u2=1;u3=1}
 screenMat.uniforms.wave.value=wave;screenMat.uniforms.u2.value=u2;screenMat.uniforms.u3.value=u3;
 screen.visible=!(k==='how'&&lt<3.6);
 // exploded blocks assemble in "how"
 phone.updateMatrixWorld(true);
 blocks.forEach((b,i)=>{
  if(k!=='how'||lt<2.2||lt>3.6){b.visible=false;return}b.visible=true;
  const a=eio((lt-2.3-i*0.12)/0.9);const sp=new THREE.Vector3(Math.cos(i*1.9+1)*3.2,Math.sin(i*2.3)*3.0+0.5,2.4+i*0.5);
  const local=sp.clone().lerp(b.userData.home,a);const w=phone.localToWorld(local.clone());
  b.position.copy(w);b.quaternion.copy(phone.quaternion);b.quaternion.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler((1-a)*0.9*Math.sin(i+1),(1-a)*(1.4+i*0.3),(1-a)*0.5)));
  b.scale.setScalar(Math.max(0.001,s)*(0.7+0.3*a))});
 // chips in 'up'
 chips.forEach((c,i)=>{const key=['ctx','sec','sty'][i];const tShow=sc.up[0]+CFG.upType0+(OFFS[key]+4)/CFG.upCps;
  const ap=k==='up'?back((t-tShow)/0.5):0;const out=k==='up'?clamp((lt-(D-0.4))/0.4):0;
  c.visible=ap>0.01&&out<1;const sw=ap<1?(1-ap)*6:0;
  c.position.set(-0.66+i*0.66,1.5+Math.sin(t*2+i)*0.03,0.5);c.rotation.set(0,Math.sin(t*1.2+i)*0.25+sw,0.04*Math.sin(t*1.7+i));c.scale.setScalar(Math.max(0.001,ap)*(1-out*0.6)*0.95)});
 // lights, particles, camera
 const ang=t*0.8;l1.position.set(Math.cos(ang)*3,1.5,Math.sin(ang)*3+1);l2.position.set(-Math.cos(ang)*3,-0.5,Math.sin(ang)*3+1);
 const p=pg.attributes.position;for(let i=0;i<N;i++){let y=pos[i*3+1]+((t*0.25*(0.3+sd[i]))%14);if(y>7)y-=14;p.setY(i,y)}p.needsUpdate=true;pts.rotation.y=t*0.03;
 const dz=k==='edit'?6.6-0.5*ease(lt/3):7;cam.position.set(Math.sin(t*0.3)*0.25,0.05+0.1*Math.sin(t*0.4),dz);cam.lookAt(0,0,0);
 updateConf(t);

};
