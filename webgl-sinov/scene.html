<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});

function tex(sx,sy,sw,sh){const c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,sw,sh);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}

function rrShape(w,h,r){const s=new THREE.Shape();const x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
function rrGeo(w,h,r){const g=new THREE.ShapeGeometry(rrShape(w,h,r),12);const p=g.attributes.position,uv=g.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,(p.getX(i)+w/2)/w,(p.getY(i)+h/2)/h);return g}

const screen=new THREE.Mesh(rrGeo(1.22,2.44,0.12),new THREE.MeshBasicMaterial({map:screenTex,toneMapped:false,color:0xb8b8b8}));screen.position.z=0.082;phone.add(screen);
const notch=new THREE.Mesh(rrGeo(0.36,0.09,0.045),new THREE.MeshBasicMaterial({color:0x000000}));notch.position.set(0,1.18,0.085);phone.add(notch);
// exploded blocks (cropped from the real screenshot)
const blocks=[];
const rects=[[0,.033,1,.072,'nav'],[0,.105,1,.287,'hero'],[.036,.449,.928,.123,'c1'],[.036,.585,.928,.123,'c2'],[.036,.721,.928,.123,'c3']];
rects.forEach((r,i)=>{const sx=r[0]*IW,sy=r[1]*IH,sw=r[2]*IW,sh=r[3]*IH;const w=1.22*r[2],h=2.44*r[3];
 const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,0.03,4,0.015),[0,1,2,3,4,5].map(j=>j===4?new THREE.MeshBasicMaterial({map:tex(sx,sy,sw,sh),toneMapped:false,color:0xb8b8b8}):new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4})));
 m.userData={i,home:new THREE.Vector3(0,1.29-(r[1]+r[3]/2-0.07)*(2.58/ (IH?1:1))*0.0,0.2)};scene.add(m);blocks.push(m)});
// particles
const N=1800,pos=new Float32Array(N*3),sd=new Float32Array(N);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*14;pos[i*3+1]=(Math.random()-.5)*14;pos[i*3+2]=(Math.random()-.5)*10-2;sd[i]=Math.random()}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:0.035,color:0xb9a6ff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(pts);
// floor
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x0c0b24,metalness:.9,roughness:.18}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.75;scene.add(floor);
const grid=new THREE.GridHelper(40,60,0x6a55ff,0x3a2f99);grid.position.y=-1.745;grid.material.transparent=true;grid.material.opacity=.35;scene.add(grid);
// lights
const l1=new THREE.PointLight(0xff6a4a,60,12),l2=new THREE.PointLight(0x7c5cff,60,12);scene.add(l1,l2);scene.add(new THREE.AmbientLight(0x6060a0,.4));
const comp=new EffectComposer(renderer);comp.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),0.5,0.5,0.92);comp.addPass(bloom);comp.addPass(new OutputPass());
const ease=x=>{x=Math.min(1,Math.max(0,x));return 1-Math.pow(1-x,3)},eio=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};
// layout targets: blocks fly from scattered exploded positions into the screen layout
const homeY=rects.map(r=>1.22-(r[1]+r[3]/2)*2.44),homeX=rects.map(r=>(r[0]+r[2]/2-0.5)*1.22);
function setT(t){
 // 0-3s assemble, 3-8s orbit
 phone.rotation.y=Math.sin(t*0.5)*0.55+ (t>6?(t-6)*0.9:0);phone.rotation.x=0.08*Math.sin(t*0.7);phone.position.y=Math.sin(t*1.3)*0.04;
 blocks.forEach((b,i)=>{const a=eio((t-0.2-i*0.35)/1.2);const sc=new THREE.Vector3(Math.cos(i*1.9+1)*1.9,Math.sin(i*2.3)*1.4+0.3,1.2+i*0.35);
  const home=new THREE.Vector3(homeX[i],homeY[i],0.1);const world=sc.clone().lerp(home,a);
  b.position.copy(world).applyEuler(new THREE.Euler(0,phone.rotation.y*a,0));
  b.rotation.set((1-a)*0.9*Math.sin(i+1),(1-a)*(1.4+i*0.3)+phone.rotation.y*a,(1-a)*0.5);
  b.visible=true;b.scale.setScalar(0.78+0.22*a);});
 screen.material.opacity=1;screen.visible=t>3.0; // screen takes over after blocks land
 const ang=t*0.8;l1.position.set(Math.cos(ang)*3,1.5,Math.sin(ang)*3+1);l2.position.set(-Math.cos(ang)*3,-0.5,Math.sin(ang)*3+1);
 pts.rotation.y=t*0.03;const p=pg.attributes.position;for(let i=0;i<N;i++){let y=pos[i*3+1]+((t*0.25*(0.3+sd[i]))%14);if(y>7)y-=14;p.setY(i,y)}p.needsUpdate=true;
 const d=7.4-1.3*eio(t/8);cam.position.set(Math.sin(t*0.25)*0.6,0.2+0.3*Math.sin(t*0.4),d);cam.lookAt(0,0,0);
}
window.setT=t=>{setT(t);comp.render()};
window.ready=true;
</script></body></html>
